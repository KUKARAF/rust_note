# Phase 2 (CRDT collab). `yrs` 0.26 provides Doc/Text plus the full Yjs
# sync + awareness wire protocol in-crate at `yrs::sync`. No `y-sync`
# (archived, yrs 0.17) or `yrs-axum` (yrs 0.18) — both pulled mismatched
# yrs copies. The Axum WebSocket transport is hand-rolled in `collab`.
#
# The `sync` feature switches yrs' internal `Doc`/`Awareness` storage from
# `Rc`/`RefCell` to `Arc`/`RwLock`, making it genuinely `Send + Sync` (yrs
# ships an `unsafe impl Send + Sync for Doc` regardless, but that is only
# *sound* with the thread-safe internals this feature enables). The collab
# room shares one `Doc`/`Awareness` across Tokio worker threads (behind a
# `std::sync::Mutex`), so this is required for correctness — and it also
# gives the observer callbacks / `Subscription` the `Send + Sync` bounds.
yrs = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
