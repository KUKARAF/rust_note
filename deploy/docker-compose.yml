services:
  rustnote:
    # Published by .github/workflows/docker-publish.yml on every main push.
    # First-time setup: the GHCR package starts private — make it public once
    # (GitHub -> Packages -> rust_note -> package settings) or `docker login
    # ghcr.io` on this host with a read:packages token.
    image: ghcr.io/kukaraf/rust_note:latest
    container_name: rustnote
    restart: unless-stopped
    # Scale-to-zero via Sablier (infra repo: env/caddy). The Caddy site block
    # for notes.osmosis.page does `import sleep_blocking notes 1h 1m`, and
    # Sablier only knows a group once a container carries these labels -
    # without them every request gets Sablier's 200 application/problem+json
    # "group notes not found" instead of reaching rust_note. The group name
    # MUST stay equal to the Caddyfile's.
    labels:
      sablier.enable: "true"
      sablier.group: notes
    # Sablier's blocking strategy waits for "healthy" when a healthcheck
    # exists, so woken requests don't race the server's startup (migrations,
    # git repo open). The runtime image has no curl/wget; bash's /dev/tcp is
    # enough: GET /health answers "ok".
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Matches the host `rafa` user (uid/gid 1004 on bigboy) so the container
    # can write into the bind-mounted /mnt/raid/vimwiki without needing to
    # chown anything on the host. Update this if deployed under a different
    # host user.
    user: "1004:1004"
    env_file:
      - .env
    environment:
      - RUSTNOTE_BASE_URL=https://notes.osmosis.page
      - RUSTNOTE_AUTHENTIK_ISSUER_URL=https://auth.osmosis.page/application/o/notes/
      - RUSTNOTE_OIDC_CLIENT_ID=rIq6SL3NMsYSuPD3cFm3B4GUD11GAoGTcjQZxVvV
      - RUSTNOTE_OIDC_REDIRECT_URI=https://notes.osmosis.page/auth/callback
      # No RUSTNOTE_OIDC_CLIENT_SECRET: this Authentik provider is a Public
      # client (PKCE-only, no shared secret) - matches how Anchor, the
      # service this replaces, was already configured.
      #
      # db.sqlite (not rust_note.db): an earlier boot attempt, before the
      # `user:` override above was added, left behind rust_note.db/-wal/-shm
      # files with inconsistent ownership/WAL state. Per instructions not to
      # delete anything, those are left in place untouched (harmless orphans
      # in this volume) and the app is pointed at a fresh filename instead.
      - RUSTNOTE_SQLITE_PATH=/data/db/db.sqlite
    volumes:
      - /mnt/raid/vimwiki:/data/notes
      - rustnote_db:/data/db
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: caddy_proxy

volumes:
  rustnote_db:
